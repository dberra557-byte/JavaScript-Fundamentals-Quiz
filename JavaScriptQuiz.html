<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Fundamentals Quiz</title>
  <style>
    body {
      background: #f0f0f0; /* light grey */
      font-family: Arial, sans-serif;
    }
    #quiz-container, #score-container {
      background-color: #ffffff; /* white for contrast */
      width: 50%;
      margin: 50px auto;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .hidden { display: none; }
    button {
      margin: 8px;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #ff5fa2; /* pink */
      color: #000000; /* black text */
      font-size: 16px;
    }
    button:hover {
      background: #e74c8c; /* darker pink */
    }
    .correct {
      background: #28a745 !important;
    }
    .incorrect {
      background: #dc3545 !important;
    }
  </style>
</head>
<body>
  <div id="quiz-container">
    <h1>JavaScript Fundamentals Quiz</h1>
    <div id="question-container"></div>
    <div id="options-container"></div>
    <button id="next-button">Next Question</button>
  </div>

  <div id="score-container" class="hidden">
    <h2>Your Score:</h2>
    <p id="score"></p>
    <button id="restart-button">Restart Quiz</button>
  </div>

  <script>
    const quizData = [
      {
        question: "What does DOM stand for?",
        options: ["Document Object Model", "Data Object Method", "Desktop Oriented Module", "Document Order Management"],
        answer: 0
      },
      {
        question: "Which keyword declares a constant variable?",
        options: ["var", "let", "const", "static"],
        answer: 2
      },
      {
        question: "Which symbol is used for strict equality?",
        options: ["==", "===", "!=", "=>"],
        answer: 1
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionContainer = document.getElementById('question-container');
    const optionsContainer = document.getElementById('options-container');
    const nextButton = document.getElementById('next-button');
    const scoreContainer = document.getElementById('score-container');
    const scoreText = document.getElementById('score');
    const quizContainer = document.getElementById('quiz-container');
    const restartButton = document.getElementById('restart-button');

    function loadQuestion() {
      const currentQuestion = quizData[currentQuestionIndex];
      questionContainer.textContent = currentQuestion.question;
      optionsContainer.innerHTML = "";

      currentQuestion.options.forEach((option, index) => {
        const optionButton = document.createElement('button');
        optionButton.textContent = option;
        optionButton.addEventListener('click', () => selectOption(index, optionButton));
        optionsContainer.appendChild(optionButton);
      });
    }

    function selectOption(selectedIndex, button) {
      const currentQuestion = quizData[currentQuestionIndex];
      const optionButtons = optionsContainer.querySelectorAll('button');

      optionButtons.forEach(btn => btn.disabled = true);

      if (selectedIndex === currentQuestion.answer) {
        score++;
        button.classList.add('correct');
      } else {
        button.classList.add('incorrect');
      }
    }

    nextButton.addEventListener('click', () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showScore();
      }
    });

    function showScore() {
      quizContainer.classList.add('hidden');
      scoreContainer.classList.remove('hidden');
      scoreText.textContent = `You scored ${score} out of ${quizData.length}`;
    }

    restartButton.addEventListener('click', () => {
      currentQuestionIndex = 0;
      score = 0;
      scoreContainer.classList.add('hidden');
      quizContainer.classList.remove('hidden');
      loadQuestion();
    });

    loadQuestion();
  </script>
</body>
</html>
